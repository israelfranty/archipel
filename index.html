/* ---------- Défis mathématiques (un seul bon choix sur 3 portes) ---------- */
const DTHEMES={
  parite:{nom:"Pairs et impairs",glyph:"12 7",isl:"port",notion:"Pair ou impair"},
  compare:{nom:"Comparer les nombres",glyph:"< > =",isl:"port",notion:"Comparer des nombres"},
  addsub:{nom:"Additions et soustractions",glyph:"+ −",isl:"foret",notion:"Calcul mental"},
  mult:{nom:"Multiplications",glyph:"×",isl:"volcan",notion:"Tables de multiplication"},
  grand:{nom:"Le plus grand, le plus petit",glyph:"↑ ↓",isl:"port",notion:"Ordonner des nombres"},
  melange:{nom:"Grand mélange",glyph:"?",isl:"port",notion:"Mélange"}};
const DRANGE=[0,[1,20],[10,100],[100,999],[100,999],[1000,9999]];
const dl3=a=>shuffle(a);
function dChallenge(theme,L){
  if(theme==="melange")theme=pick(["parite","compare","addsub","mult","grand"]);
  const [lo,hi]=DRANGE[Math.min(5,L)],T=DTHEMES[theme];let c;
  if(theme==="parite"){const want=Math.random()<.5?"pair":"impair",isW=n=>(n%2===0)===(want==="pair");
    let good;do good=R(lo,hi);while(!isW(good));const bad=new Set();while(bad.size<2){const n=R(lo,hi);if(!isW(n))bad.add(n)}
    const doors=dl3([good,...bad]);
    c={rule:`Nombre ${want}`,say:`Nombre ${want}.`,doors:doors.map(String),ok:doors.indexOf(good),
      explain:`${nf(good)} est ${want} : il se termine par ${good%10}. Les nombres pairs se terminent par 0, 2, 4, 6 ou 8.`}}
  else if(theme==="compare"){let a=R(lo,hi),b=Math.random()<.18?a:R(lo,hi);if(L>=3&&Math.random()<.4){b=a+pick([-10,10,-1,1,100,-100]);if(b<lo)b=a+1}
    const s=a<b?"<":a>b?">":"=",doors=["<",">","="];
    c={rule:`${nf(a)}  ?  ${nf(b)}`,say:`Quel signe va entre ${a} et ${b}?`,doors,ok:doors.indexOf(s),
      explain:a===b?`${nf(a)} et ${nf(b)} sont pareils : on met le signe égal.`:`${nf(Math.min(a,b))} est plus petit que ${nf(Math.max(a,b))}. La pointe du signe montre toujours le plus petit nombre : ${nf(a)} ${s} ${nf(b)}.`}}
  else if(theme==="addsub"){const add=Math.random()<.55;let a,b;
    if(L===1){a=R(2,10);b=R(1,10)}else if(L===2){a=R(10,50);b=R(2,9)}else if(L===3){a=R(20,90);b=R(11,40)}else if(L===4){a=R(100,500);b=R(10,99)}else{a=R(200,900);b=R(100,300)}
    if(!add&&b>a)[a,b]=[b,a];const r=add?a+b:a-b;
    const cand=new Set([r+1,r-1,r+10,r-10,r+2].filter(x=>x>=0&&x!==r));const bad=shuffle([...cand]).slice(0,2);const doors=dl3([r,...bad]);
    c={rule:`${nf(a)} ${add?"+":"−"} ${nf(b)}`,say:`${a} ${add?"plus":"moins"} ${b}.`,doors:doors.map(String),ok:doors.indexOf(r),
      explain:`${nf(a)} ${add?"+":"−"} ${nf(b)} = ${nf(r)}.${add?"":" Pour vérifier : "+nf(r)+" + "+nf(b)+" = "+nf(a)+"."}`,isl:"foret",notion:add?"Addition":"Soustraction"}}
  else if(theme==="mult"){const tb=L===1?pick([2,5,10]):L===2?pick([2,3,4,5,10]):R(2,10),k=R(1,10),r=tb*k;
    const cand=new Set([r+tb,r-tb,tb+k,r+1,r-1].filter(x=>x>0&&x!==r));const bad=shuffle([...cand]).slice(0,2);const doors=dl3([r,...bad]);
    const [x,y]=Math.random()<.5?[tb,k]:[k,tb];
    c={rule:`${x} × ${y}`,say:`${x} fois ${y}.`,doors:doors.map(String),ok:doors.indexOf(r),explain:`${x} × ${y} = ${r} : ${x} groupes de ${y}.`}}
  else{const big=Math.random()<.5,set=new Set();while(set.size<3)set.add(L>=3&&set.size?[...set][0]+pick([-1,1,-10,10,-100,100,90,-90]):R(lo,hi));
    const arr=[...set].filter(n=>n>0);while(arr.length<3)arr.push(R(lo,hi)+arr.length);const doors=dl3(arr.slice(0,3));const tgt=big?Math.max(...doors):Math.min(...doors);
    c={rule:big?"Le plus grand nombre":"Le plus petit nombre",say:big?"Le plus grand nombre.":"Le plus petit nombre.",doors:doors.map(String),ok:doors.indexOf(tgt),
      explain:`Le plus ${big?"grand":"petit"} est ${nf(tgt)}. On compare d'abord les chiffres de gauche : ${tgt>=100?"les centaines, puis les dizaines":"les dizaines, puis les unités"}.`}}
  return Object.assign({theme,isl:T.isl,notion:T.notion},c)}

    c.lineWidth=3*p.s;c.strokeStyle=col;c.beginPath();c.moveTo(x-w/2,p.y);c.lineTo(x-w/2,top+w*.5);c.arc(x,top+w*.5,w/2,Math.PI,0);c.lineTo(x+w/2,p.y);c.stroke();
    const txt=r.doors[i],fs=Math.max(10,(txt.length>3?w*.34:w*.46));c.font=`700 ${fs}px Fredoka, "Trebuchet MS", sans-serif`;c.textAlign="center";c.textBaseline="middle";
    c.lineWidth=fs*.14;c.strokeStyle="rgba(10,6,24,.75)";c.strokeText(txt,x,top+h*.5);c.fillStyle="#FFFFFF";c.fillText(txt,x,top+h*.5)}}
function djCoin(c,o,P,cx,LW){const p=P(o.d);if(p.y<0||o.d<-.5)return;const x=cx+(o.lane-1)*LW*p.s,r=LW*.11*p.s,y=p.y-r*1.6,sq=Math.abs(Math.cos(DG.t*5+o.d));
  c.fillStyle="#B8860B";c.beginPath();c.ellipse(x,y,r*sq+1,r,0,0,7);c.fill();c.fillStyle="#F5C542";c.beginPath();c.ellipse(x,y,r*sq*.8+1,r*.8,0,0,7);c.fill()}
/* Héros vu de dos, qui court */
function djHero(c,x,y,k,D){const h=D.hero,t=D.t*(D.phase==="fail"?0:D.boost?17:11),sw=Math.sin(t),bob=Math.abs(Math.cos(t))*6*k;
  c.save();c.translate(x,y-bob);c.scale(k,k);
  c.fillStyle="rgba(0,0,0,.35)";c.beginPath();c.ellipse(0,bob/k+2,22,6,0,0,7);c.fill();
  /* jambes */
  for(const s of[-1,1]){const a=s*sw*.5;c.save();c.translate(s*7,-30);c.rotate(a);c.fillStyle=h.skirt?h.skin:h.bottom;c.fillRect(-5,0,10,26);c.fillStyle=h.shoe;c.beginPath();c.ellipse(0,28,7,5,0,0,7);c.fill();c.restore()}
  /* corps */
  c.fillStyle=h.top;c.beginPath();c.roundRect?c.roundRect(-16,-66,32,38,9):c.rect(-16,-66,32,38);c.fill();
  if(h.skirt){c.fillStyle=h.bottom;c.beginPath();c.moveTo(-17,-34);c.lineTo(17,-34);c.lineTo(22,-20);c.lineTo(-22,-20);c.closePath();c.fill()}
  else{c.fillStyle=h.bottom;c.fillRect(-15,-34,30,8)}
  /* bras */
  for(const s of[-1,1]){c.save();c.translate(s*17,-62);c.rotate(-s*sw*.6+s*.15);c.fillStyle=h.top;c.fillRect(-4,0,8,22);c.fillStyle=h.skin;c.beginPath();c.arc(0,25,5,0,7);c.fill();c.restore()}
  /* sac à dos */
  c.fillStyle=h.bag;c.beginPath();c.roundRect?c.roundRect(-13,-64,26,30,7):c.rect(-13,-64,26,30);c.fill();c.fillStyle="rgba(255,255,255,.25)";c.fillRect(-9,-50,18,7);
  /* tête (de dos : surtout des cheveux) */
  c.fillStyle=h.skin;c.beginPath();c.arc(-17,-84,4,0,7);c.arc(17,-84,4,0,7);c.fill();
  c.fillStyle=h.hair;c.beginPath();c.arc(0,-86,17,0,7);c.fill();
  if(h.style==="puffs"){c.beginPath();c.arc(-15,-100,10,0,7);c.arc(15,-100,10,0,7);c.fill()}
  if(h.style==="curly"){for(let i=0;i<7;i++){c.beginPath();c.arc(Math.cos(i)*14,-88+Math.sin(i*2)*12,7,0,7);c.fill()}}
  if(h.style==="long"||h.style==="straight"){c.beginPath();c.moveTo(-16,-88);c.lineTo(-15,-56+Math.sin(t)*2);c.lineTo(15,-56-Math.sin(t)*2);c.lineTo(16,-88);c.closePath();c.fill()}
  c.restore()}

/* ======================================================================

const BCLIENTS=[["🦫","Castor"],["🐢","Tortue"],["🦉","Hibou"],["🦊","Renard"],["🐻","Ourson"],["🐰","Lapine"],["🦝","Raton"],["🐸","Grenouille"]];
const BBATS=["🏠","🏡","🏰","🗼","⛲","🏪","🏫","⛪","🌉","🎡","🏛️","🛖","🏯","🗽","🎠","🏬"];

const BAT_N=6;
function BS(){const g=GS();if(!g.bat)g.bat={lvl:{nombre:1,mur:1},village:[],orders:0,best:{}};if(!g.bat.best)g.bat.best={};return g.bat}
/* Nombres en lettres (jusqu'à 999), orthographe traditionnelle */
const UN=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"],DIZ=["","","vingt","trente","quarante","cinquante","soixante","soixante","quatre-vingt","quatre-vingt"];
function enLettres(n){if(n<20)return UN[n];if(n<100){const d=Math.floor(n/10),u=n%10;
    if(d===7||d===9)return DIZ[d]+(d===7&&u===1?" et ":"-")+UN[10+u];

  if(n<1000){const c=Math.floor(n/100),r=n%100;return(c===1?"cent":UN[c]+" cent"+(r===0?"s":""))+(r?" "+enLettres(r):"")}
  const m=Math.floor(n/1000),r=n%1000;return(m===1?"mille":enLettres(m)+" mille")+(r?" "+enLettres(r):"")}
function bOrder(type,L){if(type==="melange")type=Math.random()<.5?"nombre":"mur";const [emo,nom]=pick(BCLIENTS);
  if(type==="nombre"){let n,maxM=9,maxC=19,lettres=false,lack="";
    if(L===1)n=R(101,999);else if(L===2)n=R(1001,9999);
    else if(L===3){n=R(1200,9899);if(Math.floor(n/100)%10>=1&&Math.random()<.5){maxC=Math.floor(n/100)%10-1;lack=`${maxC} plaque${maxC>1?"s":""} de 100`}
      else{maxM=Math.floor(n/1000)-1;lack=`${maxM} gros cube${maxM>1?"s":""} de 1 000`}}
    else{n=R(1001,9999);lettres=true}
    const lab=lettres?`« ${enLettres(n)} »`:`<b>${nf(n)}</b>`;
    return{type,emo,nom,n,maxM,maxC,lettres,txt:`Je voudrais une tour de ${lab}${lack?`, mais il ne me reste que <b>${lack}</b>!`:"!"}`,
      say:`Je voudrais une tour de ${lettres?enLettres(n):n}${lack?`, mais il ne me reste que ${lack.replace("1 000","mille").replace("100","cent")}`:""}.`}}
  let r,c;if(L===1){r=R(2,3);c=pick([2,5,10])}else if(L===2){r=R(2,5);c=R(2,5)}else{r=R(2,9);c=R(2,10)}if(Math.random()<.5&&L<4)[r,c]=[c,r];
  if(L>=4){r=R(2,6);c=R(2,9);return{type,emo,nom,r,c,div:true,txt:`J'ai <b>${r*c} briques</b>. Fais un mur de <b>${r} rangées</b> pareilles. Combien de briques dans chaque rangée?`,say:`J'ai ${r*c} briques. Fais un mur de ${r} rangées pareilles. Combien de briques dans chaque rangée?`}}

/* --- Vérification, aide et récompense --- */
function batCheck(){const o=BG.ord,s=BG.st;let ok,msg,show="";
  if(o.type==="nombre"){const v=s.m*1000+s.c*100+s.d*10+s.u;ok=v===o.n&&s.m<=o.maxM&&s.c<=o.maxC;
    const pl=(n,w)=>`${n} ${w}${n>1?"s":""}`,parts=(o.n>=1000?pl(s.m,"millier")+", ":"")+`${pl(s.c,"centaine")}, ${pl(s.d,"dizaine")} et ${pl(s.u,"unité")}`;
    if(ok)msg=`Exactement ${nf(o.n)} : ${parts}!${s.c>=10||s.d>=10||s.u>=10?" Bravo pour les échanges : 10 centaines valent 1 millier, 10 dizaines valent 1 centaine, et 10 unités valent 1 dizaine.":""}`;
    else{const diff=o.n-v;msg=`Ta tour vaut ${nf(v)} (${parts}). ${diff>0?`Il manque ${nf(diff)}.`:`C'est ${nf(-diff)} de trop.`}`;
      if(BG.tries>=1){const m=Math.min(Math.floor(o.n/1000),o.maxM),r1=o.n-m*1000,c=Math.min(Math.floor(r1/100),o.maxC),r2=r1-c*100;
        show=`${o.lettres?`« ${enLettres(o.n)} », c'est ${nf(o.n)}. `:""}Une façon : ${o.n>=1000?pl(m,"gros cube")+" de 1 000, ":""}${pl(c,"plaque")} de 100, ${pl(Math.floor(r2/10),"barre")} de 10 et ${pl(r2%10,"petit cube")}.`}}}
  else{const tot=o.r*o.c,ans=+s.ans;
    if(o.div){ok=s.r===o.r&&s.c===o.c&&ans===o.c;msg=ok?`${tot} briques en ${o.r} rangées : ${o.c} dans chaque rangée. ${o.r} × ${o.c} = ${tot}!`:
      s.r*s.c!==tot?`Ton mur a ${s.r*s.c} briques, mais il en faut ${tot}.`:s.r!==o.r?`Il faut ${o.r} rangées.`:`Ton mur est bon! Compte les briques d'une rangée pour répondre.`;
      if(!ok&&BG.tries>=1)show=`${tot} ÷ ${o.r} = ${o.c}, parce que ${o.r} × ${o.c} = ${tot}.`}
    else{const wallOk=s.r===o.r&&s.c===o.c;ok=wallOk&&ans===tot;
      msg=ok?`${o.r} rangées de ${o.c} briques : ${o.r} × ${o.c} = ${tot} briques!`:!wallOk?`Ton mur a ${s.r} rangée${s.r>1?"s":""} de ${s.c} briques. Le client en voulait ${o.r} de ${o.c}.`:!s.ans?`Ton mur est parfait! Combien de briques en tout?`:`Ton mur est parfait, mais il n'a pas ${ans} briques. Compte ${o.r} fois ${o.c}.`;
      if(!ok&&BG.tries>=1)show=`${o.r} × ${o.c} = ${tot}. Tu peux compter par bonds de ${o.c} : ${Array.from({length:o.r},(_,i)=>(i+1)*o.c).join(", ")}.`}}
  const firstTry=BG.tries===0;BG.tries++;
  const nk=(o.type==="nombre"?"port|Valeur de position":"volcan|Multiplication en rectangle"),n=S.notions[nk]||(S.notions[nk]={r:0,t:0});
  if(firstTry){n.t++;if(ok){n.r++;S.totalOk++}}
  if(ok){BG.built[BG.i]=firstTry;if(firstTry)BG.ok++;const v=BS().village,e=pick(BBATS);v.push({e,t:Date.now()});BS().orders++;save();
    tone([[523,.08],[659,.08],[784,.1],[1047,.18]]);
    $("#fb").innerHTML=`<div class="feedback good pop"><h3>Commande livrée! <span class="emo">${e}</span></h3><p>${msg}</p><p><small>${o.emo} ${o.nom} : « Merci, ${esc(S.name||"bâtisseuse")}! »</small> Un nouveau bâtiment apparaît dans ton village.</p><button class="btn" id="b-cont">${BG.i>=BAT_N-1?"Voir mon village":"Commande suivante"}</button></div>`;
    $("#bt-go").disabled=true;$("#bt-work").querySelectorAll("button,input").forEach(x=>x.disabled=true);
    speak(`Commande livrée! ${msg}`);
    $("#b-cont").onclick=()=>{BG.i++;batNext()}}
  else{save();tone([[300,.18]]);const w=$("#bt-work .b10cols,#bt-work .wallbox");if(w){w.classList.remove("tilt");void w.offsetWidth;w.classList.add("tilt")}
    $("#fb").innerHTML=`<div class="feedback bad pop"><h3>Oups, ça penche!</h3><p>${msg}</p>${show?`<p class="ddef">${show}</p>`:""}<p><small>Corrige ta construction, puis livre-la de nouveau.</small></p></div>`;
    speak(`Oups! ${msg} ${show}`)}
  $("#fb").scrollIntoView({behavior:"smooth",block:"nearest"})}
function batEnd(){const b=BS(),N=BAT_N,ok=BG.ok,t=BG.type;const st=ok>=N?3:ok>=N-1?2:ok>=N/2?1:0;let lvlMsg="";
  const up=k=>{if(b.lvl[k]<4){b.lvl[k]++;return true}return false},down=k=>{if(b.lvl[k]>1){b.lvl[k]--;return true}return false};
  const ks=t==="melange"?["nombre","mur"]:[t];
  if(ok>=N-1){if(ks.map(up).some(Boolean))lvlMsg="Tu passes au niveau suivant : les commandes seront un peu plus difficiles!"}
  else if(ok<=2){if(ks.map(down).some(Boolean))lvlMsg="On revient au niveau précédent pour bien pratiquer."}
  if(ok>(b.best[t]||0))b.best[t]=ok;
  const vb=b.village.length;if(vb&&vb%10===0)G.events.push({k:"village",n:vb,box:true});
  if(!S.ms.first){S.ms.first=1;G.events.unshift({k:"first"})}save();
  const el=$("#ecran-fin");el.style.setProperty("--c","var(--i2)");
  el.innerHTML=`<div class="card result pop" style="--c:var(--i2)"><div class="notion">Les bâtisseurs · ${BTYPES[t].nom}</div><h2>${ok>=N-1?"Superbe travail":"Bon travail"}${S.name?", "+esc(S.name):""}!</h2>
  <div class="score">${ok} / ${N}</div>${stars(st)}<p class="msg">Commandes réussies du premier coup. Ton village compte maintenant <b>${vb} bâtiment${vb>1?"s":""}</b>.</p>${lvlMsg?`<p class="msg"><b>${lvlMsg}</b></p>`:""}
  <div class="village sm">${villageHTML(b.village)}</div>
  <div class="row-btns"><button class="btn" id="bt-again">Encore des commandes</button><button class="btn ghost" id="bt-menu">Retour au village</button></div></div>`;
  $("#bt-again").onclick=()=>startBat(t);$("#bt-menu").onclick=batMenu;BG=null;go("fin");
  tone(st>=2?[[523,.12],[659,.12],[784,.12],[1047,.25]]:[[523,.15],[659,.2]]);speak(`Bravo! ${ok} commandes sur ${N} du premier coup. Ton village compte ${vb} bâtiments.`);
  const evs=G.events.concat(PEND.splice(0));if(evs.length&&S.comp.type)setTimeout(()=>{if(!$("#ecran-fin").hidden&&!BYE)celebrate(evs);else PEND.push(...evs)},1300)}

/* ---------- Démarrage ---------- */
function syncSon(){const b=$("#btn-son");b.textContent="Son : "+(S.sound?"oui":"non");b.setAttribute("aria-pressed",String(S.sound))}
$("#btn-son").onclick=()=>{S.sound=!S.sound;save();syncSon();tone([[660,.08]])};
$("#btn-parent").onclick=renderParent;
$("#btn-pause").onclick=pauseGame;$("#btn-fin").onclick=endSession;
rollDay();renderBar();
function syncVoix(){const b=$("#btn-voix");b.hidden=!TTS;b.textContent="Voix : "+(S.voice?"oui":"non");b.setAttribute("aria-pressed",String(S.voice))}
function syncMus(){const b=$("#btn-musique");b.textContent="Musique : "+(S.music?"oui":"non");b.setAttribute("aria-pressed",String(S.music))}
$("#btn-musique").onclick=()=>{S.music=!S.music;save();syncMus();musicSync()};
syncMus();
/* Mode clair / sombre : suit l'appareil tant qu'on n'a pas choisi, puis garde le choix */
const DARKQ=window.matchMedia?matchMedia("(prefers-color-scheme: dark)"):null;
const isDark=()=>S.theme?S.theme==="dark":!!(DARKQ&&DARKQ.matches);
function syncTheme(){const d=isDark();document.documentElement.setAttribute("data-theme",d?"dark":"light");
  const b=$("#btn-theme");b.innerHTML=d?"☾ Mode : sombre":"☀ Mode : clair";b.setAttribute("aria-pressed",String(d));
  const mc=document.querySelector('meta[name="theme-color"]');if(mc)mc.content=d?"#0E1C23":"#17707F"}
$("#btn-theme").onclick=()=>{S.theme=isDark()?"light":"dark";save();syncTheme();tone([[660,.06]])};
try{DARKQ&&DARKQ.addEventListener("change",()=>{if(!S.theme)syncTheme()})}catch(e){}
syncTheme();
$("#btn-voix").onclick=()=>{S.voice=!S.voice;save();syncVoix();if(!S.voice&&TTS)TTS.cancel();else speak("La voix est activée.");const bl=$("#b-listen");if(bl)bl.hidden=!S.voice};
syncVoix();
syncSon();renderCarte();go("carte");
})();
</script>

<div id="upd" hidden style="position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:99;background:#17707F;color:#fff;border-radius:16px;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 6px 24px rgba(0,0,0,.3);font:600 1rem system-ui,sans-serif"><span>Une nouvelle version du jeu est prête!</span><button id="upd-go" style="border:0;border-radius:12px;padding:10px 18px;background:#E9A800;color:#2A2100;font:700 1rem system-ui,sans-serif">Mettre à jour</button></div>
<script>
const APP_VER="20261031-030852";
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(r=>{try{r.update()}catch(e){}}).catch(()=>{}));
let UPD_T=0;
function checkUpd(){if(Date.now()-UPD_T<20000)return;UPD_T=Date.now();
  fetch("version.txt?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():"").then(v=>{v=(v||"").trim();if(v&&v!==APP_VER){const b=document.getElementById("upd");b.hidden=false;b.style.display="flex"}}).catch(()=>{})}
document.getElementById("upd-go").onclick=async()=>{try{const r=await navigator.serviceWorker.getRegistration();if(r)await r.update()}catch(e){}location.reload()};
setTimeout(checkUpd,3000);setInterval(checkUpd,15*60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkUpd()});window.addEventListener("pageshow",()=>checkUpd());
</script>
</body></html>
